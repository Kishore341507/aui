name: 🐛 Bug Report
description: Report a bug or unexpected behavior in the AUI project
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the details below to help us reproduce and resolve it quickly.

  - type: textarea
    id: description
    attributes:
      label: 📝 Description
      description: A clear and concise description of what the bug is.
      placeholder: Provide a clear description of the issue...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🔄 Steps to Reproduce
      description: Clear, step-by-step instructions so anyone can reproduce the behavior.
      placeholder: |
        1. Navigate to '...'
        2. Click on '....'
        3. Notice error: '....'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 🎯 Expected Behavior & Acceptance Criteria
      description: What should happen instead? What defines a successful fix?
      placeholder: Explain what you expected to happen and criteria for a fix...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 📂 Affected Area
      description: Which part of the application does this bug affect?
      options:
        - Frontend / UI & Styling
        - Authentication & Discord OAuth
        - Forms & Webhooks
        - Prisma & Database
        - Documentation / Setup
        - Other
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 📸 Screenshots or Error Logs (Optional)
      description: Drag & drop screenshots or paste terminal / console logs here if relevant.
      placeholder: Paste any error messages or stack traces here...

  - type: checkboxes
    id: contribution
    attributes:
      label: 🤝 Contribution
      options:
        - label: I would like to work on a Pull Request to fix this bug!
